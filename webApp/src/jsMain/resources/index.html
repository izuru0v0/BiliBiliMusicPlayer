<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B站音乐播放器</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111;color:#f5f2e9}
main{max-width:900px;margin:auto;padding:24px}h1{color:#f8d347}section{background:#1d1d20;border-radius:18px;padding:20px;margin:16px 0}
form,li{display:flex;flex-wrap:wrap;gap:8px}li{margin:6px 0}ul{padding:0;list-style:none}
input,button,a{font:inherit;padding:10px 12px;border-radius:10px}input{background:#27272a;border:1px solid #53514a;flex:1}
button{background:#323236;border:0;color:inherit;cursor:pointer}button:hover{background:#49464a}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #f8d347}
.primary{background:#f8d347;color:#151515}a{color:#f8d347}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
</style>
<main>
<h1>B站音乐播放器</h1>
<section>
<form id="add">
<input id="video" aria-label="BV 号或视频链接" placeholder="BV 号或视频链接" required>
<input id="title" aria-label="自定义标题" placeholder="标题（可选）">
<button class="primary">添加并播放</button>
</form>
<p><a href="https://search.bilibili.com/" target="_blank" rel="noopener">在 B 站找歌</a></p>
<p id="status" role="status">尚未播放音乐</p>
<iframe id="player" title="B 站视频播放器" allow="autoplay; fullscreen" allowfullscreen hidden></iframe>
</section>
<section><h2>我的歌单</h2><button id="shuffle">随机播放</button><ul id="library"></ul></section>
<section><h2>最近播放</h2><ul id="recent"></ul></section>
</main>
<script src="bilimusic.js"></script>
</html>
